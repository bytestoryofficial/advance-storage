name: advance-storage-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: advance
      POSTGRES_PASSWORD: advance_dev_password
      POSTGRES_DB: advance_storage
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U advance -d advance_storage']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  pg_data:
  redis_data:
