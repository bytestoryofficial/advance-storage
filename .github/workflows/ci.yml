name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: advance_storage_test
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d advance_storage_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      # keep your existing checkout / pnpm / node setup steps
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @advance-storage/db exec prisma generate
      - run: pnpm -r --workspace-concurrency=1 --if-present test

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
