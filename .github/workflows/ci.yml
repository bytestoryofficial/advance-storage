name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast static checks: no database needed
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only for `prisma generate`; nothing connects to it
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  # Unit + integration tests against a real Postgres
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same values as .env.test, so `prisma generate` and the tests agree
      DATABASE_URL: postgresql://test:test@localhost:5434/advance_storage_test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: advance_storage_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d advance_storage_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # One package at a time: db and api share the same test database
      - run: pnpm -r --workspace-concurrency=1 --if-present test
